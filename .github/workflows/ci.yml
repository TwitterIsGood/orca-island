name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh
      - name: Test plugin
        run: node --test tests/*.test.mjs
      - name: Test native layout and completion behavior
        run: |
          ./tests/check-native.sh
          ./tests/check-completions.sh
          ./tests/check-sync.sh
      - name: Build companion for this runner
        run: ./scripts/build-companion.sh --arch native
